info:
  name: Post_Jogos
  type: http

http:
  method: POST
  url: http://localhost:3000/jogos
  body:
    type: json
    data: |-
      {
        "titulo": "shalldiver",
        "ano_lancamento": 2025,
        "estudio_id": 1
      }
